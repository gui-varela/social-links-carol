name: Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *" # diário, 06:00 em Brasília: atualiza as avaliações do Google
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Montar o site (somente arquivos públicos)
        run: |
          mkdir _site
          cp -r index.html 404.html robots.txt sitemap.xml CNAME assets data _site/
          if [ -d links ]; then cp -r links _site/; fi

      - name: Buscar avaliações do Google
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          PLACE_ID: ${{ vars.PLACE_ID }}
          PLACES_REFERER: ${{ vars.PLACES_REFERER }}
        run: |
          if [ -n "$GOOGLE_PLACES_API_KEY" ] && [ -n "$PLACE_ID" ]; then
            node scripts/fetch-reviews.mjs _site/data/reviews.json
          else
            echo "Secrets/variáveis não configurados: o site mostrará apenas o link para o Google."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
